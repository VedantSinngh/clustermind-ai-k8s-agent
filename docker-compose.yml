version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: clustermind-db
    environment:
      POSTGRES_USER: clustermind
      POSTGRES_PASSWORD: clustermind_dev_pass
      POSTGRES_DB: clustermind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clustermind -d clustermind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clustermind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clustermind-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://clustermind:clustermind_dev_pass@postgres:5432/clustermind_db
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-""}
      GROQ_MODEL: llama-3.3-70b-versatile
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clustermind-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
